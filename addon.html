<!DOCTYPE html>
<html>
<head>
<title>C2KVerse</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#101410;color:white;font-family:Arial}
header{text-align:center;padding:18px;background:#171c17;border-bottom:2px solid #49c653}
h1{color:#62e86b;margin:0;font-size:30px}
.container{max-width:900px;margin:20px auto;padding:15px}
.search{width:100%;padding:13px;border-radius:9px;border:2px solid #315b35;background:#111811;color:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:20px}
.card{background:#111811;border:1px solid #315b35;border-radius:12px;overflow:hidden}
.card img{width:100%;height:150px;object-fit:cover}
.info{padding:14px}
h2{color:#62e86b;font-size:20px;margin:0 0 8px}
p{color:#aaa;line-height:1.4}
.btn{display:block;text-align:center;background:#49c653;color:#071008;padding:11px;border-radius:7px;text-decoration:none;font-weight:bold}
@media(max-width:600px){
.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
<h1>⛏️ C2KVERSE</h1>
<p>MINECRAFT ADDONS & SKINS</p>
</header>
<div class="container">
<input class="search" id="search" placeholder="🔍 Search addons...">
<div class="grid" id="grid">
<div class="card">
<img src="YOUR-IMAGE-URL">
<div class="info">
<h2>Bedrock Essentials+</h2>
<p>All-in-one survival utilities.</p>
<p>Version: 1.8.1</p>
<a class="btn" href="YOUR-DOWNLOAD-LINK">⬇️ Download</a>
</div></div>

<div class="card">
<img src="YOUR-OFFHAND-IMAGE-URL">
<div class="info">
<h2>Off Hand</h2>
<p>Off Hand feature for Bedrock.</p>
<a class="btn" href="YOUR-OFFHAND-DOWNLOAD-LINK">⬇️ Download</a>
</div></div>

</div></div>
<script>
search.oninput=()=>document.querySelectorAll(".card").forEach(c=>c.style.display=c.innerText.toLowerCase().includes(search.value.toLowerCase())?"block":"none");
</script>
</body>
</html>
