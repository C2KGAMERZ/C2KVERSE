<!DOCTYPE html><html><head>
<title>C2KVerse</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;color:#fff;font-family:Arial;
background:linear-gradient(#0008,#000b),url("YOUR-MINECRAFT-BG");
background-size:cover;background-attachment:fixed}
header{text-align:center;padding:20px;background:#142018dd;border-bottom:3px solid #49c653}
h1{margin:0;color:#62e86b;font-size:34px;
font-family:monospace;font-weight:900;text-shadow:3px 3px #000}
header p{margin:6px;color:#ccc}
.box{max-width:900px;margin:20px auto;padding:15px}
.search{width:100%;padding:13px;border:2px solid #49c653;border-radius:9px;background:#111d;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:20px}
.card{background:#111d;border:2px solid #315b35;border-radius:12px;overflow:hidden}
.card img{width:100%;height:150px;object-fit:cover}
.info{padding:14px}
h2{color:#62e86b;font-size:20px}
p{color:#bbb;line-height:1.4}
.btn{display:block;padding:11px;text-align:center;background:#49c653;color:#071008;text-decoration:none;font-weight:bold;border-radius:7px}
</style></head><body>
<header><h1>⛏ C2KVERSE</h1><p>MINECRAFT ADDONS & SKINS</p></header>
<div class="box"><input class="search" id="s" placeholder="🔍 Search addons...">
<div class="grid">
<div class="card"><img src="YOUR-IMAGE-URL"><div class="info">
<h2>Bedrock Essentials+</h2><p>All-in-one survival utilities.</p>
<a class="btn" href="YOUR-DOWNLOAD-LINK">⬇ Download</a></div></div>

<div class="card"><img src="YOUR-OFFHAND-IMAGE-URL"><div class="info">
<h2>Off Hand</h2><p>Off Hand feature for Bedrock.</p>
<a class="btn" href="YOUR-OFFHAND-DOWNLOAD-LINK">⬇ Download</a></div></div>

</div></div>
<script>
s.oninput=()=>document.querySelectorAll(".card").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(s.value.toLowerCase())?"block":"none");
</script></body></html>
