<!DOCTYPE html>
<html>
<head>
<title>C2KVerse - Addons</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
color:#fff;
background:#182015;
min-height:100vh;
}
.bg{
position:fixed;
inset:0;
z-index:-2;
background:
linear-gradient(#0003,#0007),
url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1920&q=85")
center/cover no-repeat;
}
header{
text-align:center;
padding:22px 10px;
background:#101510cc;
border-bottom:3px solid #55d85c;
}
h1{
margin:0;
font-family:Impact,monospace;
font-size:42px;
letter-spacing:3px;
color:#69e86e;
text-shadow:4px 4px 0 #000;
}
header p{margin:6px 0;color:#ddd}
.box{max-width:760px;margin:25px auto;padding:12px}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}
.card{
background:#101510ed;
border:2px solid #4b8b4e;
border-radius:8px;
overflow:hidden;
aspect-ratio:1/1.08;
box-shadow:0 6px 18px #0009;
}
.card img{
width:100%;
height:52%;
object-fit:cover;
display:block;
}
.info{padding:10px}
h2{
margin:0 0 5px;
font-size:18px;
color:#69e86e;
}
.info p{
margin:4px 0;
font-size:13px;
color:#ccc;
}
.btn{
display:block;
margin-top:9px;
padding:8px;
text-align:center;
background:#4dcc55;
color:#071007;
text-decoration:none;
font-weight:bold;
border-radius:5px;
}
.btn:hover{background:#72ed78}
</style>
</head>

<body>

<div class="bg"></div>

<header>
<h1>C2KVERSE</h1>
<p>MINECRAFT ADDONS & SKINS</p>
</header>

<div class="box">
<div class="grid">
<div class="card">
<img src="YOUR-IMAGE-URL" alt="Bedrock Essentials+">
<div class="info">
<h2>Bedrock Essentials+</h2>
<p>All-in-one survival utilities.</p>
<a class="btn" href="YOUR-DOWNLOAD-LINK">⬇ Download</a>
</div>
</div>

<div class="card">
<img src="YOUR-OFFHAND-IMAGE-URL" alt="Off Hand">
<div class="info">
<h2>Off Hand</h2>
<p>Adds an Off Hand feature to Bedrock.</p>
<a class="btn" href="YOUR-OFFHAND-DOWNLOAD-LINK">⬇ Download</a>
</div>
</div>

</div>
</div>

</body>
</html>
