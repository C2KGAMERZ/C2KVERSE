<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>C2KVerse - Addons</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:
    linear-gradient(rgba(10,12,10,.65),rgba(10,12,10,.88)),
    url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=80")
    center/cover fixed;
}

header{
  text-align:center;
  padding:35px 15px 25px;
  background:rgba(10,10,10,.55);
  border-bottom:2px solid #777;
}

.logo{
  font-family:Impact,Arial Black,sans-serif;
  font-size:48px;
  letter-spacing:4px;
  color:#fff;
  text-shadow:
    3px 3px 0 #111,
    0 0 8px rgba(255,255,255,.25);
}

.subtitle{
  margin-top:8px;
  font-size:14px;
  color:#bbb;
  letter-spacing:2px;
}

.container{
  width:92%;
  max-width:1000px;
  margin:25px auto;
}
.search-box{
  margin:25px auto 30px;
  max-width:650px;
}

.search-box input{
  width:100%;
  padding:15px 20px;
  border:1px solid #777;
  border-radius:10px;
  outline:none;
  background:rgba(20,20,20,.9);
  color:#fff;
  font-size:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.4);
}

.search-box input:focus{
  border-color:#bbb;
  box-shadow:0 0 12px rgba(255,255,255,.15);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.card{
  background:rgba(18,18,18,.92);
  border:1px solid #555;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.info{
  padding:18px;
}

.info h2{
  font-size:21px;
  margin-bottom:8px;
}

.info p{
  color:#aaa;
  font-size:14px;
  line-height:1.5;
}

.btn{
  display:inline-block;
  margin-top:15px;
  padding:11px 18px;
  background:#eee;
  color:#111;
  text-decoration:none;
  border-radius:7px;
  font-weight:bold;
}

.btn:hover{
  background:#fff;
}

.no-results{
  display:none;
  text-align:center;
  color:#aaa;
  padding:30px;
  font-size:16px;
}
</style>
</head>

<body>

<header>
  <div class="logo">C2KGAMERZ</div>
  <div class="subtitle">MINECRAFT ADDONS</div>
</header>

<div class="container">

  <div class="search-box">
    <input
      type="text"
      id="addonSearch"
      placeholder="🔍 Search addons..."
      autocomplete="off">
  </div>

  <div class="grid" id="addonGrid">

    <div class="card" data-name="Bedrock Essentials+">
      <img src="YOUR-IMAGE-URL" alt="Bedrock Essentials+">
      <div class="info">
        <h2>Bedrock Essentials+</h2>
        <p>Useful features and improvements for Minecraft Bedrock.</p>
        <a class="btn" href="YOUR-DOWNLOAD-LINK">⬇️ Download</a>
      </div>
    </div>

    <div class="card" data-name="Off Hand">
      <img src="YOUR-IMAGE-URL" alt="Off Hand">
      <div class="info">
        <h2>Off Hand</h2>
        <p>Add useful off-hand features to your Minecraft Bedrock world.</p>
        <a class="btn" href="YOUR-DOWNLOAD-LINK">⬇️ Download</a>
      </div>
    </div>

  </div>

  <div class="no-results" id="noResults">
    No addons found 😕
  </div>

</div>
 <script>
const searchInput = document.getElementById("addonSearch");
const cards = document.querySelectorAll(".card");
const noResults = document.getElementById("noResults");

searchInput.addEventListener("input", function(){

  const search = this.value.toLowerCase().trim();
  let found = 0;

  cards.forEach(function(card){

    const name = card.dataset.name.toLowerCase();

    if(name.includes(search)){
      card.style.display = "";
      found++;
    }else{
      card.style.display = "none";
    }

  });

  noResults.style.display = found === 0 ? "block" : "none";

});
</script>

</body>
</html>
