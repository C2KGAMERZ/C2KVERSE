<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C2KVerse - Addons</title>
 <style>
body {
  background: url("https://raw.githubusercontent.com/c2kgamerz/C2KVERSE/main/file_00000000806c82118aa7b960f14b1b7f.png");
  background-size: 100% 100%;
  background-position: center;
  background-attachment: fixed;
}
   *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
}
header{
  text-align:center;
  padding:30px 15px 20px;
  background:rgba(0,0,0,.65);
  border-bottom:2px solid #555;
}

.logo{
  font-family:Impact,Arial Black,sans-serif;
  font-size:46px;
  letter-spacing:4px;
  color:#e8e8e8;
  text-shadow:
    3px 3px 0 #111,
    0 0 12px rgba(255,255,255,.25);
}

.subtitle{
  margin-top:7px;
  font-size:13px;
  color:#aaa;
  letter-spacing:2px;
}

.search-button{
  margin-top:22px;
  padding:11px 22px;
  border:1px solid #777;
  border-radius:8px;
  background:#202020;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.search-button:hover{
  background:#333;
}
.search-area{
  display:none;
  max-width:650px;
  margin:20px auto;
}

.search-area input{
  width:100%;
  padding:14px 18px;
  background:#151515;
  color:white;
  border:2px solid #777;
  border-radius:10px;
  outline:none;
  font-size:16px;
}

.search-area input:focus{
  border-color:#aaa;
}
.container{
  width:92%;
  max-width:1000px;
  margin:25px auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card{
  background:rgba(20,20,20,.95);
  border:1px solid #555;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,.6);
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

.info{
  padding:14px;
}

.info h2{
  font-size:19px;
  margin-bottom:7px;
}

.info p{
  color:#aaa;
  font-size:13px;
  line-height:1.4;
}
.download{
  display:block;
  width:100%;
  margin-top:12px;
  padding:11px;
  text-align:center;
  background:#ddd;
  color:#111;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
}

.download:hover{
  background:#fff;
}

.no-results{
  display:none;
  text-align:center;
  padding:35px 10px;
  color:#aaa;
  font-size:16px;
}
</style>
</head>

<body>

<header>
  <div class="logo">C2KGAMERZ</div>
  <div class="subtitle">MINECRAFT ADDONS</div>

  <button class="search-button" onclick="toggleSearch()">
    🔍 Search
  </button>

  <div class="search-area" id="searchArea">
    <input
      type="text"
      id="addonSearch"
      placeholder="Search addons..."
      autocomplete="off"
    >
  </div>
</header>

<div class="container">

  <div class="grid" id="addonGrid">
<div class="card" data-name="Off Hand">

      <img src="YOUR-OFFHAND-IMAGE" alt="Off Hand">

      <div class="info">
        <h2>Off Hand</h2>

        <p>
          Off Hand addon for Minecraft Bedrock.
        </p>

        <a class="download" href="YOUR-OFFHAND-DOWNLOAD">
          ⬇ Download
        </a>
      </div>

    </div>


    <div class="card" data-name="Bedrock Essentials+">

      <img src="YOUR-BEDROCK-IMAGE" alt="Bedrock Essentials+">

      <div class="info">
        <h2>Bedrock Essentials+</h2>

        <p>
          Useful features for Minecraft Bedrock.
        </p>

        <a class="download" href="YOUR-BEDROCK-DOWNLOAD">
          ⬇ Download
        </a>
      </div>

    </div>
</div>

  <div class="no-results" id="noResults">
    No addons found 😕
  </div>

</div>
<script>

function toggleSearch(){

  const area = document.getElementById("searchArea");

  if(area.style.display === "block"){
    area.style.display = "none";
  }else{
    area.style.display = "block";
    document.getElementById("addonSearch").focus();
  }

}

const searchInput = document.getElementById("addonSearch");
const cards = document.querySelectorAll(".card");
const noResults = document.getElementById("noResults");

searchInput.addEventListener("input", function(){

  const search = this.value.toLowerCase().trim();
  let found = 0;

  cards.forEach(function(card){

    const name = card.dataset.name.toLowerCase();

    if(name.includes(search)){
      card.style.display = "";
      found++;
    }else{
      card.style.display = "none";
    }

  });

  noResults.style.display = found === 0 ? "block" : "none";

});
</script>

</body>
</html>
