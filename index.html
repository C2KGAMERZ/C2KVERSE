<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0d120e;
  color:#eee;
  font-family:Arial,sans-serif;
}

/* HEADER */
header{
  background:#151d16;
  border-bottom:2px solid #49c653;
  position:sticky;
  top:0;
  z-index:100;
}

.top{
  max-width:1100px;
  margin:auto;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#62e86b;
}

nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

nav a{
  color:#ddd;
  text-decoration:none;
  padding:8px;
}

nav a:hover{
  color:#62e86b;
}

/* HERO */
.hero{
  padding:50px 15px;
  text-align:center;
  background:linear-gradient(135deg,#1b3220,#0d120e);
}

.hero h1{
  font-size:42px;
  margin-bottom:10px;
}

.hero h1 span{
  color:#62e86b;
}

.hero p{
  color:#aaa;
  margin-bottom:25px;
}

/* SEARCH */
.search{
  max-width:700px;
  margin:auto;
  display:flex;
}

.search input{
  flex:1;
  min-width:0;
  padding:15px;
  border:0;
  outline:none;
  font-size:16px;
  border-radius:8px 0 0 8px;
}

.search button{
  padding:15px 22px;
  border:0;
  background:#49c653;
  font-weight:bold;
  cursor:pointer;
  border-radius:0 8px 8px 0;
}
