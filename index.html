<!DOCTYPE html>
<html>
<head>
  <title>C2KVerse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #101410;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    header {
      background: #171c17;
      padding: 20px;
      border-bottom: 2px solid #49c653;
    }

    h1 {
      color: #62e86b;
    }

    .box {
      margin: 40px 15px;
      padding: 30px;
      background: #1b241c;
      border-radius: 15px;
    }

    button {
      background: #49c653;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
    .addons{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
  margin-top:25px;
}

.card{
  background:#111811;
  border:1px solid #2d3d2e;
  border-radius:14px;
  padding:18px;
  text-align:left;
}

.card-image{
  height:150px;
  border-radius:10px;
  background:#315b35;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  margin-bottom:15px;
}

.card h3{
  margin:8px 0;
}

.card p{
  color:#aaa;
  line-height:1.5;
}
  </style>
</head>

<body>

<header>
  <h1>⛏️ C2KVerse</h1>
  <p>Minecraft Bedrock Addons & Skins</p>
</header>
<div class="box">

  <h2>🔥 Latest Addons</h2>

  <div class="card">
    <div class="image">🐉</div>

    <h3>Dragon Addon</h3>

    <p>
      Add powerful dragons to your Minecraft Bedrock world!
    </p>

    <p>⭐ 4.8 • 🧩 Addon</p>

    <button>Download</button>
  </div>

  <div class="card">
    <div class="image">⚔️</div>

    <h3>Epic Weapons</h3>

    <p>
      Get awesome new weapons and gear.
    </p>

    <p>⭐ 4.7 • 🧩 Addon</p>

    <button>Download</button>
  </div>

</div>
Bedrock content website.</p>
  <button>🧩 Browse Addons</button>
</div>

</body>
</html>
