<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>C2KVerse</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  background:#000;
}

body{
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

.home{
  position:relative;
  width:100%;
  max-width:1024px;
}

.home img{
  display:block;
  width:100%;
  height:auto;
}

.link{
  position:absolute;
  display:block;
  z-index:5;
}
.link-subscribe{
  left:33%;
  top:56.5%;
  width:34%;
  height:5.5%;
}

.link-addons{
  left:3.5%;
  top:66%;
  width:21.5%;
  height:24%;
}

.link-skins{
  left:27%;
  top:66%;
  width:21.5%;
  height:24%;
}

.link-textures{
  left:50.5%;
  top:66%;
  width:21.5%;
  height:24%;
}

.link-maps{
  left:74.5%;
  top:66%;
  width:21.5%;
  height:24%;
}

.link-youtube{
  left:37.5%;
  top:93.5%;
  width:6%;
  height:4%;
}

.link-instagram{
  left:47%;
  top:93.5%;
  width:6%;
  height:4%;
}

.link-discord{
  left:56.5%;
  top:93.5%;
  width:6%;
  height:4%;
}

.link-subscribe{
  position:absolute;
  animation:realSubscribeGlow 1.2s infinite;
  border-radius:12px;
  pointer-events:auto;
}

@keyframes realSubscribeGlow{
  0%,100%{
    box-shadow:
      0 0 5px #55ff55,
      0 0 10px #55ff55;
  }
  50%{
    box-shadow:
      0 0 10px #55ff55,
      0 0 25px #55ff55,
      0 0 40px #55ff55;
  }
}
  
</style>
</head>

<body>

<div class="home">

  <img src="hp.jpg" alt="C2KVerse Home">

  <a class="link link-subscribe"
     href="https://www.youtube.com/@CREEPERX2K"
     target="_blank"></a>

  <a class="link link-addons"
     href="addon.html"></a>

  <a class="link link-skins" href="#"></a>

  <a class="link link-textures" href="#"></a>

  <a class="link link-maps" href="#"></a>

  <a class="link link-youtube"
     href="https://www.youtube.com/@CREEPERX2K"
     target="_blank"></a>

  <a class="link link-instagram" href="#"></a>

  <a class="link link-discord" href="#"></a>

</div>

</body>
</html>
