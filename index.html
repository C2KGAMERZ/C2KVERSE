<!DOCTYPE html>
<html>
<head>
  <title>C2KVerse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #101410;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    header {
      background: #171c17;
      padding: 20px;
      border-bottom: 2px solid #49c653;
    }

    h1 {
      color: #62e86b;
    }

    .box {
      margin: 40px 15px;
      padding: 30px;
      background: #1b241c;
      border-radius: 15px;
    }

    button {
      background: #49c653;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
    .addons{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
  margin-top:25px;
}

.card{
  background:#111811;
  border:1px solid #2d3d2e;
  border-radius:14px;
  padding:18px;
  text-align:left;
}

.card-image{
  height:150px;
  border-radius:10px;
  background:#315b35;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  margin-bottom:15px;
}

.card h3{
  margin:8px 0;
}

.card p{
  color:#aaa;
  line-height:1.5;
}

.addon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.addon-card {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.35);
  text-align: left;
}

.addon-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  display: block;
}

.addon-info {
  padding: 15px;
}

.addon-info h3 {
  margin: 0 0 8px;
  font-size: 20px;
}

.addon-info p {
  color: #aaa;
  line-height: 1.5;
  margin: 0 0 15px;
}

.addon-info button {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 7px;
  background: #35a853;
  color: white;
  font-size: 16px;
  font-weight: bold;
}    

.search-box {
  margin-bottom: 20px;
}

.search-box input {
  width: 90%;
  max-width: 600px;
  padding: 14px 18px;
  border: 1px solid #3b4a3c;
  border-radius: 10px;
  background: #111811;
  color: white;
  font-size: 16px;
  outline: none;
  box-sizing: border-box;
}

.search-box input::placeholder {
  color: #888;
}

.search-box input:focus {
  border-color: #49c653;
}

<script>
  const searchInput = document.getElementById("addonSearch");
  const searchButton = document.getElementById("searchButton");
  const addonCards = document.querySelectorAll(".addon-card");

  searchButton.addEventListener("click", function () {
    const searchText = searchInput.value.toLowerCase().trim();

    addonCards.forEach(function (card) {
      const addonText = card.textContent.toLowerCase();

      if (searchText === "" || addonText.includes(searchText)) {
        card.style.display = "";
      } else {
        card.style.display = "none";
      }
    });
  });
</script>
    
  </style>
</head>

<body>

<header>
  <h1>⛏️ C2KVerse</h1>
  <p>Minecraft Bedrock Addons & Skins</p>
</header>
<div class="box">

 <div class="search-box">
  <input type="text" id="addonSearch" placeholder="🔍 Search addons...">
  <button id="searchButton">🔍 Search</button>
</div>
  
  <h2>🔥 Latest Addons</h2>

  <div class="addon-grid">

    <div class="addon-card">
      <img src="https://placehold.co/600x350/png?text=Dragon+Addon" alt="Dragon Addon">

      <div class="addon-info">
        <h3>Dragon Addon</h3>
        <p>Epic dragons for Minecraft Bedrock!</p>
        <button>Download</button>
      </div>
    </div>

    <div class="addon-card">
      <img src="https://placehold.co/600x350/png?text=Epic+Weapons" alt="Epic Weapons">

      <div class="addon-info">
        <h3>Epic Weapons</h3>
        <p>Powerful new weapons for Minecraft Bedrock!</p>
        <button>Download</button>
      </div>
    </div>

  </div>

</div>

Bedrock content website.</p>
  <button>🧩 Browse Addons</button>
</div>


  <script>
  const searchInput = document.getElementById("addonSearch");
  const searchButton = document.getElementById("searchButton");
  const addonCards = document.querySelectorAll(".addon-card");

  searchButton.addEventListener("click", function () {
    const searchText = searchInput.value.toLowerCase().trim();

    addonCards.forEach(function (card) {
      const addonText = card.textContent.toLowerCase();

      if (searchText === "" || addonText.includes(searchText)) {
        card.style.display = "";
      } else {
        card.style.display = "none";
      }
    });
  });
</script>  
  
</body>
</html>
