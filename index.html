<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>C2KVerse</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:
    linear-gradient(rgba(5,10,6,.72),rgba(5,10,6,.88)),
    url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=80")
    center/cover fixed;
}

header{
  text-align:center;
  padding:45px 15px 30px;
  border-bottom:2px solid #55d85c;
}

.logo{
  font-family:Impact,Arial Black,sans-serif;
  font-size:55px;
  letter-spacing:4px;
  color:#66e66c;
  text-shadow:3px 3px 0 #111;
}

.subtitle{
  margin2-top:10px;
  font-size:15px;
  font-weight:bold;
  letter-spacing:2px;
}

.container{
  width:92%;
  max-width:1000px;
  margin:auto;
}
.hero{
  text-align:center;
  padding:55px 15px 35px;
}

.hero h2{
  font-family:Impact,Arial Black,sans-serif;
  font-size:38px;
  letter-spacing:2px;
  text-shadow:3px 3px 0 #111;
}

.hero p{
  margin:12px 0 22px;
  color:#ddd;
  font-weight:bold;
}

.subscribe-btn{
  display:inline-block;
  padding:14px 28px;
  background:#55d85c;
  color:#071007;
  text-decoration:none;
  font-weight:bold;
  border-radius:8px;
  box-shadow:0 4px 0 #27842d;
}

.subscribe-btn:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #27842d;
}

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin:20px 0 50px;
}

.category{
  min-height:150px;
  padding:25px 15px;
  background:rgba(15,20,15,.88);
  border:2px solid #3f9e45;
  border-radius:12px;
  text-align:center;
  text-decoration:none;
  color:white;
  transition:.2s;
}

.category:hover{
  transform:translateY(-4px);
  border-color:#66e66c;
}

.category .icon{
  font-size:45px;
  margin-bottom:12px;
}

.category h3{
  font-size:20px;
  letter-spacing:1px;
}

.category p{
  margin-top:7px;
  color:#aaa;
  font-size:13px;
}
